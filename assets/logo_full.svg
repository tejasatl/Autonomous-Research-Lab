<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1d"/>
      <stop offset="100%" stop-color="#020610"/>
    </linearGradient>

    <!-- Cyan Glow & Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <linearGradient id="aLeft" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0052cc"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>

    <linearGradient id="aRight" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#0077ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Slate Background Container -->
  <rect x="0" y="0" width="1200" height="360" rx="20" fill="url(#cardBg)"/>

  <!-- Left Logo Mark (Centered at x=190, y=170, scale=0.75) -->
  <g transform="translate(45, 10) scale(0.72)">
    <!-- Orbital Ellipse -->
    <g transform="rotate(-26 250 210)" filter="url(#fGlow)">
      <ellipse cx="250" cy="210" rx="190" ry="56" fill="none" stroke="#00aaff" stroke-width="5" opacity="0.85"/>
      <circle cx="60" cy="210" r="12" fill="#00f0ff"/>
      <circle cx="60" cy="210" r="6" fill="#ffffff"/>
      <circle cx="440" cy="210" r="10" fill="#00e5ff"/>
      <circle cx="440" cy="210" r="5" fill="#ffffff"/>
    </g>

    <!-- Stylized A -->
    <polygon points="246,90 208,90 108,318 158,318 246,120" fill="url(#aLeft)" filter="url(#fGlow)"/>
    <polygon points="246,90 254,90 358,318 304,318 238,172" fill="url(#aRight)" filter="url(#fGlow)"/>

    <!-- Graph inside A -->
    <g filter="url(#fGlow)">
      <line x1="246" y1="230" x2="204" y2="296" stroke="#00d2ff" stroke-width="3.5"/>
      <line x1="246" y1="230" x2="288" y2="296" stroke="#00d2ff" stroke-width="3.5"/>
      <line x1="204" y1="296" x2="288" y2="296" stroke="#00d2ff" stroke-width="3.5"/>
      <line x1="246" y1="230" x2="246" y2="322" stroke="#00d2ff" stroke-width="3.5"/>
      <line x1="204" y1="296" x2="246" y2="322" stroke="#00d2ff" stroke-width="3.5"/>
      <line x1="288" y1="296" x2="246" y2="322" stroke="#00d2ff" stroke-width="3.5"/>
      
      <circle cx="246" cy="230" r="9" fill="#00f0ff"/>
      <circle cx="246" cy="230" r="4.5" fill="#ffffff"/>
      <circle cx="204" cy="296" r="8" fill="#00d2ff"/>
      <circle cx="288" cy="296" r="8" fill="#00d2ff"/>
      <circle cx="246" cy="322" r="10" fill="#00f0ff"/>
      <circle cx="246" cy="322" r="5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="435" y1="80" x2="435" y2="245" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Brand Typography -->
  <!-- "AUTONOMOUS" -->
  <text x="475" y="152" fill="#ffffff" font-family="'Plus Jakarta Sans', -apple-system, Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="4px">AUTONOMOUS</text>

  <!-- "RESEARCH LAB" -->
  <text x="475" y="228" fill="url(#cyanGrad)" font-family="'Plus Jakarta Sans', -apple-system, Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="4px" filter="url(#fGlow)">RESEARCH LAB</text>

  <!-- Subtitle with flanking rules -->
  <g transform="translate(0, 288)">
    <line x1="80" y1="0" x2="160" y2="0" stroke="#334155" stroke-width="1.5"/>
    <text x="600" y="5" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', -apple-system, Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="3.5px">AUTONOMOUS SCIENTIFIC DISCOVERY &amp; MULTI-AGENT RESEARCH PLATFORM</text>
    <line x1="1040" y1="0" x2="1120" y2="0" stroke="#334155" stroke-width="1.5"/>
  </g>
</svg>
